<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Monthly Temperature Matrix</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <!-- style wrap is for formatting purposes, ai usage helped to optimize formatting given basic initial parameters-->
    <style>
        body { 
            font-family: sans-serif; 
            margin: 20px; 
        }
        
        .tooltip {
            position: absolute;
            background-color: white;
            border: 1px solid #ccc;
            padding: 6px 10px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }
        
        .axis path, .axis line { 
            fill: none; 
            stroke: #000; 
            shape-rendering: crispEdges; 
        }
        
        .axis text { 
            font-size: 11px; 
        }
    </style>
</head>
<body>

<div id="chart"></div>
<div class="tooltip" id="tooltip"></div>

<!-- referencing js file for heatmap display-->>
<script src="heatmap.js"></script>

</body>
</html>
